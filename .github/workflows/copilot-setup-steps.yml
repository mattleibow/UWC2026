name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - Directory.Build.props
      - dotnet-tools.json
      - NuGet.Config
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - Directory.Build.props
      - dotnet-tools.json
      - NuGet.Config

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Install Android MAUI workload
        shell: bash
        run: dotnet workload install maui-android

      - name: Restore repository tools
        shell: bash
        run: dotnet tool restore --configfile NuGet.Config

      - name: Verify MAUI CLI
        shell: bash
        run: |
          dotnet --version
          dotnet workload --version
          dotnet maui --version
